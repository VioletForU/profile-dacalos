<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Derby Dash</title>
<link rel="stylesheet" href="derby-dash.css">
</head>
<body>

<header class="site-header">
  <h1>Derby Dash</h1>
  <p class="subtitle">Five horses, one finish line. Hit start and see who takes it.</p>
</header>

<main>
  <section class="track-wrap" id="track" aria-label="Race track">
    <div class="finish" aria-hidden="true"></div>
    <!-- lanes injected by derby-dash.js -->
  </section>

  <div class="controls">
    <button id="startBtn" type="button">Start race</button>
    <button id="resetBtn" type="button" disabled>Reset</button>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>
</main>

<footer class="site-footer">
  <p>Part of the <a href="../index.html">Derby Dash Arcade</a> — Joshua Mari M. Dacalos</p>
</footer>

<script src="derby-dash.js"></script>
</body>
</html>
